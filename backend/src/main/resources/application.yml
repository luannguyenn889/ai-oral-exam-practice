spring:
  application:
    name: oral-exam-backend
  main:
    banner-mode: "off"
  datasource:
    # PostgreSQL local mặc định; có thể ghi đè bằng DB_URL/DB_USERNAME/DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_oral_exam_practice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-development-only-change-this-secret-before-deployment-2026}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
