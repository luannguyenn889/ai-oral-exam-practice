<div class="layout">
  <header class="header">
    <div class="header__inner container">
      <div class="header__brand">
        <span class="material-symbols-outlined header__logo-icon">school</span>
        <span class="header__title">Quản Lý Ngân Hàng Đề Thi & Rubric</span>
        <span class="header__role-tag">Giảng viên</span>
      </div>

      <nav class="nav">
        <a routerLink="/instructor/courses" routerLinkActive="nav__link--active" class="nav__link">
          <span class="material-symbols-outlined">class</span>
          <span>Học phần</span>
        </a>
        <a
          routerLink="/instructor/questions"
          routerLinkActive="nav__link--active"
          class="nav__link"
        >
          <span class="material-symbols-outlined">quiz</span>
          <span>Danh sách câu hỏi</span>
        </a>
        <a
          routerLink="/instructor/questions/new"
          routerLinkActive="nav__link--active"
          class="nav__link"
        >
          <span class="material-symbols-outlined">add_circle</span>
          <span>Tạo câu hỏi</span>
        </a>
      </nav>

      @if (authService.currentUser$ | async; as user) {
        <div class="user-box">
          <div class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-email">{{ user.email }}</span>
          </div>
          <a routerLink="/login" class="btn btn--ghost btn--sm" title="Đổi vai trò hoặc đăng xuất">
            <span class="material-symbols-outlined">logout</span>
          </a>
        </div>
      }
    </div>
  </header>

  <main class="main">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>© 2026 Cổng thông tin Giảng viên — Hệ Thống Ôn Luyện Vấn Đáp AI.</p>
    </div>
  </footer>
</div>
