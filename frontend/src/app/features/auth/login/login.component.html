<main class="auth-page">
  <section class="auth-card card" aria-labelledby="login-title">
    <div class="auth-card__header">
      <div class="auth-card__icon" aria-hidden="true">
        <span class="material-symbols-outlined">school</span>
      </div>
      <p class="auth-card__eyebrow">AI ORAL EXAM PRACTICE</p>
      <h1 id="login-title">Chào mừng trở lại</h1>
      <p class="auth-card__description">Đăng nhập để tiếp tục ôn luyện.</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="ban@example.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="auth-field__error">Vui lòng nhập email hợp lệ.</small>
        }
      </label>

      <label class="auth-field">
        <span>Mật khẩu</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="Mật khẩu" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="auth-field__error">Vui lòng nhập mật khẩu.</small>
        }
      </label>

      <button class="btn btn--primary auth-submit" type="submit" [disabled]="loading">
        @if (loading) {
          <span class="material-symbols-outlined auth-spinner" aria-hidden="true">progress_activity</span>
        }
        {{ loading ? 'Đang xử lý...' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="auth-switch">Chưa có tài khoản? <a routerLink="/register">Tạo tài khoản</a></p>
    <p class="auth-note">Đăng nhập được xác thực qua backend.</p>
  </section>
</main>
