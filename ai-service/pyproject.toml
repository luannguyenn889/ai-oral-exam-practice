[project]
name = "oral-exam-ai-service"
version = "0.2.0"
description = "AI processing service for oral exam practice (Multi-provider STT, IT Spell Correction, Hybrid RAG & Rubric Grading)"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
local-stt = [
    "openai-whisper>=20231117",
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
