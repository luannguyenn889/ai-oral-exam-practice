[project]
name = "oral-exam-ai-service"
version = "0.1.0"
description = "AI processing service scaffold for oral exam practice"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
